<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: site.title }}</title>
    <meta name="description" content="Portal oficial do evento PRISM Conecta 2026.">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.googletagmanager.com; style-src 'self' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://plataforma-externa.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com; frame-src 'self' https://www.google.com https://maps.google.com; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'">
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    
    <link rel="icon" type="image/svg+xml" href="{{ '/assets/icons/favicon.svg' | relative_url }}">
    <link rel="shortcut icon" href="{{ '/assets/icons/favicon.svg' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
    
  </head>
  <body>
    
    {% include cookie-consent.html %}

    <header class="topbar">
      <div class="wrap topbar-row">
        <a href="/" class="brand">PRISM Conecta Hub</a>
        <nav class="main-nav" aria-label="Navegação principal">
          <a href="/">Home</a>
          <a href="/#noticias">Notícias</a>
          <a href="/#agenda">Agenda</a>
          <a href="/#localizacao">Localização</a>
        </nav>
        <div class="topbar-actions">
          <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Alternar tema"><img src="/assets/icons/dark-mode.png" alt="Alternar Tema" width="24" height="24"></button>
          <a href="https://plataforma-externa.com/inscricao" target="_blank" rel="noopener noreferrer" class="cta">Inscrever-se</a>
        </div>
      </div>
    </header>

    <main>
      {{ content }}
    </main>

    <footer class="footer">
      <div class="wrap">
        <p>PRISM Conecta 2026 • Arquitetura estática Jamstack</p>
        <nav class="footer-nav" aria-label="Links legais">
          <a href="{{ '/politica-privacidade/' | relative_url }}">Política de Privacidade</a>
          <span aria-hidden="true">•</span>
          <a href="{{ '/termos-uso/' | relative_url }}">Termos de Uso</a>
        </nav>
      </div>
    </footer>

    <script src="{{ '/assets/js/cookie-manager.js' | relative_url }}" defer></script>

    <script src="{{ '/assets/js/monitoring.js' | relative_url }}" defer></script>
    <script src="{{ '/assets/js/theme-manager.js' | relative_url }}" defer></script>
    <script src="{{ '/assets/js/search-utils.js' | relative_url }}" defer></script>
    <script src="{{ '/assets/js/search.js' | relative_url }}" defer></script>

    <div id="third-party-scripts">
      <!-- Scripts carregados dinamicamente pelo cookie-manager.js -->
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
      {% unless site.google_analytics_measurement_id == blank %}
        <meta name="ga4-measurement-id" content="{{ site.google_analytics_measurement_id | escape }}">
        <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics_measurement_id | escape }}"></script>
      {% endunless %}
    </div>
  </body>
</html>

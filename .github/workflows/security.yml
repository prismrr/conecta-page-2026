name: Security and Hardening

on:
  pull_request:
  push:
    branches: ["main", "develop"]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.after }}
          extra_args: --only-verified --exclude-paths=.trufflehogignore

  dependency-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node deps
        run: npm ci

      - name: NPM Critical Audit
        run: npm audit --audit-level=critical

  ruby-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Install bundler-audit
        run: gem install bundler-audit

      - name: Bundle Audit
        run: |
          BDIR=$(ruby -e 'print Gem.bindir')
          AUDIT_BIN="$BDIR/bundle-audit"
          if [ ! -x "$AUDIT_BIN" ]; then AUDIT_BIN="$BDIR/bundler-audit"; fi
          "$AUDIT_BIN" check --update

  link-policy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      - name: Validate external links policy
        run: ruby scripts/validate_external_links.rb
